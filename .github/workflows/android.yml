name: Android Debug APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure MapKit API key for CI (if secret provided)
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          if [ -n "$YANDEX_MAPKIT_API_KEY" ]; then
            echo "YANDEX_MAPKIT_API_KEY=$YANDEX_MAPKIT_API_KEY" > .env
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: samokatkz-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
